
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventario ST</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --azul:      #00588f;
      --azul-dark: #003f6b;
      --azul-light:#e6f1f8;
      --blanco:    #ffffff;
      --gris-bg:   #f4f7fa;
      --gris-txt:  #5a6a7a;
      --borde:     #d0dde9;
      --radius:    14px;
      --shadow:    0 4px 24px rgba(0,88,143,0.10);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--gris-bg);
      font-family: 'Barlow', 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 32px 16px 48px;
    }

    /* ── LOGO ── */
    .logo-wrap {
      margin-bottom: 28px;
      display: flex;
      justify-content: center;
    }
    .logo-wrap img {
      height: 72px;
      width: auto;
      filter: brightness(0) saturate(100%) invert(26%) sepia(66%) saturate(600%) hue-rotate(177deg) brightness(85%) contrast(110%);
    }

    /* ── CARD ── */
    .card {
      background: var(--blanco);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--borde);
      width: 100%;
      max-width: 440px;
      overflow: hidden;
      animation: fadeUp .45s ease both;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(18px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* ── HEADER CARD ── */
    .card-header {
      background: var(--azul);
      padding: 20px 24px 18px;
    }
    .serial-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      color: rgba(255,255,255,.65);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .serial-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--blanco);
      letter-spacing: .02em;
      word-break: break-all;
    }
    .serial-value.not-found {
      font-size: 16px;
      color: rgba(255,255,255,.8);
    }

    /* ── STATS ROW ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 1px solid var(--borde);
    }
    .stat-item {
      padding: 18px 12px;
      text-align: center;
      border-right: 1px solid var(--borde);
    }
    .stat-item:last-child { border-right: none; }
    .stat-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--gris-txt);
      margin-bottom: 6px;
    }
    .stat-num {
      font-size: 26px;
      font-weight: 700;
      line-height: 1;
    }
    .stat-num.entrada  { color: #00a86b; }
    .stat-num.reservado{ color: #e07b00; }
    .stat-num.salida   { color: #c0392b; }

    /* ── BUTTONS ── */
    .buttons {
      padding: 20px 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      border: none;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .03em;
      cursor: pointer;
      transition: background .2s, transform .12s, opacity .2s;
    }
    .btn:active { transform: scale(.975); }

    /* Botones en azul ST */
    .btn-entrada   { background: var(--azul); color: #fff; }
    .btn-reservado { background: var(--azul); color: #fff; }
    .btn-salida    { background: var(--azul); color: #fff; }

    .btn:disabled {
      opacity: .35;
      cursor: not-allowed;
      transform: none;
    }
    .btn:not(:disabled):hover { background: var(--azul-dark); }

    /* ── LOADING / ERROR ── */
    .state-msg {
      padding: 32px 24px;
      text-align: center;
      color: var(--gris-txt);
      font-size: 15px;
    }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: var(--azul);
      color: #fff;
      padding: 12px 24px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 6px 24px rgba(0,88,143,.3);
      opacity: 0;
      transition: all .35s cubic-bezier(.34,1.56,.64,1);
      z-index: 999;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast.error { background: #c0392b; }

    /* ── FOOTER ── */
    footer {
      margin-top: 24px;
      font-size: 12px;
      color: #9aaabb;
      letter-spacing: .04em;
    }
  </style>
</head>
<body>

  <!-- LOGO -->
  <div class="logo-wrap">
    <img src="https://jeroromero31-hue.github.io/inventario-qr/logo_ST.png"
         onerror="this.style.display='none'"
         alt="ST Refrigeración" />
  </div>

  <!-- CARD -->
  <div class="card" id="card">
    <div class="state-msg" id="loading">Buscando serie…</div>
  </div>

  <div class="toast" id="toast"></div>

  <footer>Inventario ST · <span id="fecha"></span></footer>

<script>
/* ─────────── CONFIG ─────────── */
const AIRTABLE_TOKEN    = 'patOBX4ENq4pyKFWh.b5921054bea69f092bd1d612566b708a2f673f3b79113a43dd21cb9375394035';
const BASE_ID           = 'appZvdaRb4ghDI8X9';
const TABLE_COMPRAS     = 'Compras';
const FIELD_SERIE_C     = 'Serie';
const FIELD_ENTRADA_QR  = 'Entrada QR';
const FIELD_ENTRADA_OK  = 'Entrada aplicada';
const TABLE_SALIDAS     = 'Salidas';
const FIELD_SERIE_S     = 'Serie';
const FIELD_RESERVADO_QR= 'Reservado QR';
const FIELD_RESERVADO_OK= 'Reservado aplicado';
const FIELD_SALIDA_QR   = 'Salida QR';
const FIELD_SALIDA_OK   = 'Salida aplicada';
/* ─────────────────────────────── */

document.getElementById('fecha').textContent =
  new Date().toLocaleDateString('es-MX', { year:'numeric', month:'numeric', day:'numeric' });

const params = new URLSearchParams(window.location.search);
const serial = params.get('serial');

let recCompras = null;
let recSalidas = null;

/* ── Helpers ── */
const api = (path, method='GET', body=null) => {
  const opts = {
    method,
    headers: {
      'Authorization': `Bearer ${AIRTABLE_TOKEN}`,
      'Content-Type':  'application/json'
    }
  };
  if (body) opts.body = JSON.stringify(body);
  return fetch(`https://api.airtable.com/v0/${BASE_ID}/${path}`, opts).then(r=>r.json());
};

const filterURL = (table, field, value) =>
  `${encodeURIComponent(table)}?filterByFormula=${encodeURIComponent(`{${field}}="${value}"`)}`;

function showToast(msg, error=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (error ? ' error' : '');
  setTimeout(() => t.className = 'toast', 2800);
}

/* ── Render ── */
function render() {
  const card = document.getElementById('card');

  if (!serial) {
    card.innerHTML = `
      <div class="card-header">
        <div class="serial-label">N. Serie</div>
        <div class="serial-value not-found">Sin serie en la URL</div>
      </div>
      <div class="state-msg">Escanea el QR de un producto.</div>`;
    return;
  }

  const entradaQR   = recCompras?.fields?.[FIELD_ENTRADA_QR]   ?? 0;
  const entradaOK   = recCompras?.fields?.[FIELD_ENTRADA_OK]   ?? false;
  const reservadoQR = recSalidas?.fields?.[FIELD_RESERVADO_QR] ?? 0;
  const reservadoOK = recSalidas?.fields?.[FIELD_RESERVADO_OK] ?? false;
  const salidaQR    = recSalidas?.fields?.[FIELD_SALIDA_QR]    ?? 0;
  const salidaOK    = recSalidas?.fields?.[FIELD_SALIDA_OK]    ?? false;

  const disE = !recCompras || entradaOK;
  const disR = !recSalidas || reservadoOK;
  const disS = !recSalidas || salidaOK;

  card.innerHTML = `
    <div class="card-header">
      <div class="serial-label">N. Serie</div>
      <div class="serial-value">${serial}</div>
    </div>

    <div class="stats">
      <div class="stat-item">
        <div class="stat-label">Entrada</div>
        <div class="stat-num entrada">${entradaQR}</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Reservado</div>
        <div class="stat-num reservado">${reservadoQR}</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Salida</div>
        <div class="stat-num salida">${salidaQR}</div>
      </div>
    </div>

    <div class="buttons">
      <button class="btn btn-entrada"   id="btnE" ${disE?'disabled':''} onclick="accionEntrada()">📦 Entrada</button>
      <button class="btn btn-reservado" id="btnR" ${disR?'disabled':''} onclick="accionReservado()">🔒 Reservado</button>
      <button class="btn btn-salida"    id="btnS" ${disS?'disabled':''} onclick="accionSalida()">🚚 Salida</button>
    </div>`;
}

/* ── Acciones ── */
async function accionEntrada() {
  if (!recCompras) return;
  document.getElementById('btnE').disabled = true;
  const curr = recCompras.fields[FIELD_ENTRADA_QR] ?? 0;
  await api(`${encodeURIComponent(TABLE_COMPRAS)}/${recCompras.id}`, 'PATCH', {
    fields: { [FIELD_ENTRADA_QR]: curr+1, [FIELD_ENTRADA_OK]: true }
  });
  recCompras.fields[FIELD_ENTRADA_QR] = curr+1;
  recCompras.fields[FIELD_ENTRADA_OK] = true;
  render();
  showToast('✅ Entrada registrada');
}

async function accionReservado() {
  if (!recSalidas) return;
  document.getElementById('btnR').disabled = true;
  const curr = recSalidas.fields[FIELD_RESERVADO_QR] ?? 0;
  await api(`${encodeURIComponent(TABLE_SALIDAS)}/${recSalidas.id}`, 'PATCH', {
    fields: { [FIELD_RESERVADO_QR]: curr+1, [FIELD_RESERVADO_OK]: true }
  });
  recSalidas.fields[FIELD_RESERVADO_QR] = curr+1;
  recSalidas.fields[FIELD_RESERVADO_OK] = true;
  render();
  showToast('🔒 Reservado registrado');
}

async function accionSalida() {
  if (!recSalidas) return;
  document.getElementById('btnS').disabled = true;
  const curr  = recSalidas.fields[FIELD_SALIDA_QR]    ?? 0;
  const currR = recSalidas.fields[FIELD_RESERVADO_QR]  ?? 0;
  await api(`${encodeURIComponent(TABLE_SALIDAS)}/${recSalidas.id}`, 'PATCH', {
    fields: {
      [FIELD_SALIDA_QR]:    curr+1,
      [FIELD_SALIDA_OK]:    true,
      [FIELD_RESERVADO_QR]: Math.max(0, currR-1)
    }
  });
  recSalidas.fields[FIELD_SALIDA_QR]    = curr+1;
  recSalidas.fields[FIELD_SALIDA_OK]    = true;
  recSalidas.fields[FIELD_RESERVADO_QR] = Math.max(0, currR-1);
  render();
  showToast('🚚 Salida registrada');
}

/* ── Init ── */
async function init() {
  if (!serial) { render(); return; }
  try {
    const [rC, rS] = await Promise.all([
      api(filterURL(TABLE_COMPRAS, FIELD_SERIE_C, serial)),
      api(filterURL(TABLE_SALIDAS, FIELD_SERIE_S, serial))
    ]);
    recCompras = rC.records?.[0] ?? null;
    recSalidas = rS.records?.[0] ?? null;
    render();
  } catch(e) {
    document.getElementById('card').innerHTML =
      `<div class="state-msg">Error al conectar con Airtable.</div>`;
  }
}

init();
</script>
</body>
</html>
